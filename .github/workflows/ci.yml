
name: Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build and Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d --name task-manager-ci \
            -p 8000:8000 task-manager:${{ github.sha }}

      - name: Verify deployment
        run: |
          curl --fail --retry 10 --retry-connrefused \
            --retry-delay 2 http://localhost:8000/health

      - name: Stop Docker container
        if: always()
        run: docker rm -f task-manager-ci || true
