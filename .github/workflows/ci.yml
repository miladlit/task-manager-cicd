
name: Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python Tests and Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: warn

      - name: Check code quality with Ruff
        run: python -m ruff check app tests

  docker-build:
    name: Build and Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d --name task-manager-ci \
            -p 8000:8000 task-manager:${{ github.sha }}

      - name: Verify deployment
        run: |
          curl --fail --retry 10 --retry-all-errors \
            --retry-delay 2 http://localhost:8000/health

      - name: Stop Docker container
        if: always()
        run: docker rm -f task-manager-ci || true
