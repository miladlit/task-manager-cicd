name: TaskFlow CI and Delivery

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest and Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: warn
      - name: Ruff code checks
        run: python -m ruff check app tests

  docker-build:
    name: Build and verify Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t taskflow:${{ github.sha }} .
      - name: Start application
        run: docker run -d --name taskflow-ci -p 8000:8000 taskflow:${{ github.sha }}
      - name: Verify health and readiness
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 http://localhost:8000/ready
          curl --fail http://localhost:8000/dashboard -o /dev/null
      - name: Remove temporary container
        if: always()
        run: docker rm -f taskflow-ci || true

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  update-gitops:
    name: Optionally update infrastructure repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    env:
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
    steps:
      - name: Explain optional setup
        if: env.INFRA_REPO_TOKEN == ''
        run: echo 'Add INFRA_REPO_TOKEN with Contents write access to the infrastructure repo to enable automatic GitOps tag updates.'
      - name: Checkout infrastructure repository
        if: env.INFRA_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: miladlit/task-manager-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infrastructure
      - name: Update Kubernetes image tag
        if: env.INFRA_REPO_TOKEN != ''
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("infrastructure/k8s/app.yaml")
          source = path.read_text()
          pattern = r"(image:\s*)ghcr\.io/miladlit/task-manager-cicd:[^\s]+"
          new_image = "ghcr.io/miladlit/task-manager-cicd:" + os.environ["GITHUB_SHA"]
          updated, changes = re.subn(pattern, lambda m: m.group(1) + new_image, source)
          if changes != 1:
              raise SystemExit("Expected exactly one TaskFlow container image in k8s/app.yaml")
          path.write_text(updated)
          PY
          git -C infrastructure config user.name 'github-actions[bot]'
          git -C infrastructure config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C infrastructure add k8s/app.yaml
          if ! git -C infrastructure diff --cached --quiet; then
            git -C infrastructure commit -m "deploy: TaskFlow image ${GITHUB_SHA}"
            git -C infrastructure push origin main
          fi
